<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>Калорийка</title>
<style>
:root{--bg:#0b0d10;--card:#151922;--card2:#1c212c;--line:#262c39;--text:#f2f5f8;--muted:#8b93a3;--green:#4ade80;--green2:#22c55e;--prot:#60a5fa;--fat:#fbbf24;--carb:#f472b6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:18px 16px 40px;max-width:480px;margin:0 auto}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.top{margin-bottom:16px}
.top .date{color:var(--muted);font-size:14px;margin-top:2px}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.card h2{font-size:16px;font-weight:700;margin-bottom:10px}
.card.glow{background:linear-gradient(160deg,#16211b,#151922 60%)}
input,select{width:100%;padding:14px;margin:6px 0;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--green)}
button{width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--green),var(--green2));color:#04210f;font-size:17px;font-weight:800;margin-top:8px}
button:active{transform:scale(.98)}
button:disabled{opacity:.6}
button.sec{background:var(--card2);color:var(--muted);font-size:14px;font-weight:600;padding:12px}
.ringwrap{position:relative;width:200px;height:200px;margin:4px auto 8px}
.ringwrap svg{width:200px;height:200px;transform:rotate(-90deg)}
.ringwrap .bg{stroke:var(--card2)}
.ringwrap .fg{stroke:var(--green);transition:stroke-dashoffset .6s ease}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt .big{font-size:40px;font-weight:800;letter-spacing:-1px}
.ringtxt .small{font-size:13px;color:var(--muted);margin-top:2px}
.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.4}
.macro{margin-bottom:12px}
.macro:last-child{margin-bottom:0}
.mrow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.mrow b{font-weight:700}
.mrow span{color:var(--muted)}
.bar{height:10px;background:var(--card2);border-radius:8px;overflow:hidden}
.bar div{height:100%;border-radius:8px;width:0;transition:width .6s ease}
#pBar{background:var(--prot)}#fBar{background:var(--fat)}#cBar{background:var(--carb)}
.snap{display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;padding:20px;border-radius:22px;margin-bottom:14px;box-shadow:0 8px 24px rgba(74,222,128,.25)}
.meal{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .ico{width:42px;height:42px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.meal .info{flex:1;min-width:0}
.meal .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .mc{font-size:12px;color:var(--muted);margin-top:2px}
.meal .kc{font-weight:800;font-size:15px;color:var(--green)}
.meal .del{width:auto;margin:0;padding:6px 10px;background:var(--card2);color:var(--muted);font-size:14px;border-radius:10px}
.note{border-radius:18px;padding:14px 16px;margin-bottom:14px;font-size:14px;line-height:1.45}
.note.report{background:#13251b;border:1px solid #1f4d33}
.note.tip{background:var(--card);border:1px solid var(--line)}
.note.boost{background:#271f10;border:1px solid #5a4417}
.wrow{display:flex;gap:8px}
.wrow input{flex:1;margin:0}
.wrow button{width:auto;margin:0;padding:14px 20px;font-size:16px}
#chart{width:100%;height:120px;display:block;margin:12px 0 6px}
.hidden{display:none}
#file{display:none}
</style>
</head>
<body>

<div id="setup" class="hidden">
<div class="top"><h1>Давай знакомиться</h1><div class="date">Это нужно один раз</div></div>
<div class="card">
<input id="name" placeholder="Имя">
<select id="sex"><option value="m">Мужской</option><option value="f">Женский</option></select>
<input id="age" type="number" placeholder="Возраст">
<input id="height" type="number" placeholder="Рост, см">
<input id="weight" type="number" step="0.1" placeholder="Текущий вес, кг">
<input id="goal" type="number" step="0.1" placeholder="Желаемый вес, кг">
<input id="key" placeholder="Ключ Gemini">
<button onclick="saveSetup()">Начать</button>
</div>
</div>

<div id="main" class="hidden">
<div class="top"><h1 id="hello"></h1><div class="date" id="dateTxt"></div></div>

<div class="card glow">
<div class="ringwrap">
<svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="10"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
<div class="ringtxt"><div class="big" id="kcal">0</div><div class="small">ккал съедено</div></div>
</div>
<div class="sub" id="kcalSub"></div>
</div>

<button class="snap" id="snapBtn" onclick="document.getElementById('file').click()"><span style="font-size:26px">📷</span> Сфотографировать еду</button>
<input id="file" type="file" accept="image/*" capture="environment" onchange="onPhoto(this)">

<div class="note report hidden" id="report"></div>
<div class="note boost hidden" id="boost"></div>
<div class="note tip hidden" id="tip"></div>

<div class="card">
<h2>Белки, жиры, углеводы</h2>
<div class="macro"><div class="mrow"><b>Белки</b><span id="pTxt"></span></div><div class="bar"><div id="pBar"></div></div></div>
<div class="macro"><div class="mrow"><b>Жиры</b><span id="fTxt"></span></div><div class="bar"><div id="fBar"></div></div></div>
<div class="macro"><div class="mrow"><b>Углеводы</b><span id="cTxt"></span></div><div class="bar"><div id="cBar"></div></div></div>
</div>

<div class="card">
<h2>Сегодня съедено</h2>
<div id="meals"></div>
</div>

<div class="card">
<h2>Мой вес</h2>
<div class="wrow"><input id="wInput" type="number" step="0.1" placeholder="Вес сегодня, кг"><button onclick="addWeight()">Записать</button></div>
<svg id="chart" viewBox="0 0 300 120" preserveAspectRatio="none"></svg>
<div class="sub" id="wSub"></div>
</div>

<button class="sec" onclick="changeKey()">Сменить ключ Gemini</button>
<button class="sec" onclick="resetAll()">Сбросить всё</button>
</div>

<script>
const MODEL='gemini-flash-latest';
const $=id=>document.getElementById(id);
const load=()=>{try{return JSON.parse(localStorage.getItem('app')||'null')}catch(e){return null}};
const save=d=>localStorage.setItem('app',JSON.stringify(d));
// Местная дата телефона, а не UTC (иначе после полуночи день путался)
const today=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
const dayDiff=(a,b)=>Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/86400000);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=Math.round(parseFloat(v));return isFinite(x)&&x>=0?x:0};

function saveSetup(){
 const w=parseFloat($('weight').value);
 const d={name:$('name').value.trim(),sex:$('sex').value,age:+$('age').value,height:+$('height').value,weight:w,goal:parseFloat($('goal').value)||0,key:$('key').value.trim(),start:today(),log:[],weights:[{date:today(),w:w}],boost:0,boostDate:null};
 if(!d.name||!d.age||!d.height||!d.weight||!d.key){alert('Заполни все поля');return}
 save(d);init();
}

function resetAll(){if(confirm('Удалить все данные?')){localStorage.removeItem('app');init()}}

function changeKey(){
 const d=load();const k=prompt('Новый ключ Gemini',d.key||'');
 if(k&&k.trim()){d.key=k.trim();save(d);alert('Ключ обновлён')}
}

function dayNumber(d){return dayDiff(d.start,today())+1}

function maintenance(d){
 const bmr=10*d.weight+6.25*d.height-5*d.age+(d.sex==='m'?5:-161);
 return Math.round(bmr*1.4);
}

// Среднее только за три дня наблюдения (дни 1-3 от старта)
function observedAvg(d){
 const days={};
 d.log.forEach(m=>{const n=dayDiff(d.start,m.date);if(n>=0&&n<3){days[m.date]=(days[m.date]||0)+m.kcal}});
 const keys=Object.keys(days);
 if(!keys.length)return null;
 return Math.round(keys.reduce((s,k)=>s+days[k],0)/keys.length);
}

function currentWeight(d){
 const ws=d.weights||[];
 return ws.length?ws[ws.length-1].w:d.weight;
}

function targets(d){
 // Берём большее из реального среднего и расчёта по формуле, чтобы не занизить норму при недоедании
 const base=Math.max(d.baseline||0,maintenance(d));
 const kcal=Math.round(base*1.1)+(d.boost||0);
 const wt=currentWeight(d);
 const p=Math.round(wt*2);
 const f=Math.round(wt*1.0);
 const c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
 return{kcal,p,f,c,base};
}

function addWeight(){
 const d=load();
 const v=parseFloat(String($('wInput').value).replace(',','.'));
 if(!v||v<30||v>300){alert('Введи нормальный вес в кг');return}
 d.weights=d.weights||[];
 const last=d.weights[d.weights.length-1];
 if(last&&last.date===today()){last.w=v}else{d.weights.push({date:today(),w:v})}
 save(d);
 $('wInput').value='';
 checkBoost();
 render();
}

// Только повышаем норму: если за 14 дней вес вырос меньше чем на 0.2 кг, +150 ккал (не чаще раза в 14 дней). Никогда не убавляем.
function checkBoost(){
 const d=load();
 if(dayNumber(d)<=3)return;
 const ws=d.weights||[];
 if(ws.length<2)return;
 const last=ws[ws.length-1];
 const old=ws.filter(x=>dayDiff(x.date,last.date)>=13);
 if(!old.length)return;
 if(d.boostDate&&dayDiff(d.boostDate,last.date)<14)return;
 const ref=old[old.length-1];
 if(last.w-ref.w<0.2){
  d.boost=(d.boost||0)+150;
  d.boostDate=last.date;
  d.boostMsg='Вес почти не рос за две недели, поэтому норма повышена на 150 ккал.';
  save(d);
 }
}

let busy=false;
async function onPhoto(inp){
 const file=inp.files[0];if(!file||busy)return;
 busy=true;$('snapBtn').disabled=true;
 const d=load();
 $('kcalSub').textContent='Анализирую фото...';
 try{
  const b64=await toBase64(file);
  const prompt='Ты нутрициолог. Оцени блюдо на фото, учитывая масло и соусы. Ответь ТОЛЬКО JSON: {"name":"название по-русски","kcal":число,"protein":число,"fat":число,"carbs":число,"grams":число}. Если на фото не еда, верни kcal 0 и name "не еда". Если порция неочевидна, оцени типичную.';
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+encodeURIComponent(d.key),{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0.2}})
  });
  const j=await r.json();
  if(!r.ok||j.error)throw new Error(j.error?j.error.message:('код '+r.status));
  const txt=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts[0].text;
  if(!txt)throw new Error('нейросеть не ответила, попробуй ещё раз');
  const mt=txt.match(/\{[\s\S]*\}/);
  const m=JSON.parse(mt?mt[0]:txt);
  if(!num(m.kcal)){alert('Не удалось распознать еду на фото');}
  else{
   const fresh=load();
   fresh.log.push({id:Date.now(),date:today(),time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}),name:String(m.name||'Блюдо').slice(0,60),kcal:num(m.kcal),p:num(m.protein),f:num(m.fat),c:num(m.carbs)});
   save(fresh);
  }
 }catch(e){alert('Ошибка анализа: '+e.message)}
 busy=false;$('snapBtn').disabled=false;
 inp.value='';render();
}

function delMeal(id){
 if(!confirm('Удалить этот приём пищи?'))return;
 const d=load();d.log=d.log.filter(m=>m.id!==id);save(d);render();
}

function toBase64(file){
 return new Promise((res,rej)=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{
   const s=Math.min(1,1024/Math.max(img.width,img.height));
   const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   URL.revokeObjectURL(url);
   res(c.toDataURL('image/jpeg',0.8).split(',')[1]);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('не удалось открыть фото'))};
  img.src=url;
 });
}

function setBar(id,txt,v,max){
 $(id+'Txt').textContent=txt;
 $(id+'Bar').style.width=Math.min(100,max?v/max*100:0)+'%';
}

function setRing(v,max){
 const C=326.7;
 const frac=max?Math.min(1,v/max):0;
 $('ringFg').style.strokeDashoffset=C*(1-frac);
}

function mealIcon(time){
 const h=parseInt(time,10);
 if(h<11)return '🍳';
 if(h<16)return '🍲';
 if(h<21)return '🍝';
 return '🥛';
}

function drawChart(d){
 const ws=(d.weights||[]).slice(-30);
 const svg=$('chart');
 if(ws.length<2){svg.innerHTML='';$('wSub').textContent=ws.length?('Сейчас '+ws[0].w+' кг. График появится после второй записи.'):'';return}
 const vals=ws.map(x=>x.w);
 let min=Math.min(...vals),max=Math.max(...vals);
 if(max-min<1){max=min+1}
 const pad=8;
 const pts=ws.map((x,i)=>{
  const px=pad+i*(300-2*pad)/(ws.length-1);
  const py=112-(x.w-min)/(max-min)*104;
  return [px.toFixed(1),py.toFixed(1)];
 });
 const line=pts.map(p=>p.join(',')).join(' ');
 const area=line+' '+pts[pts.length-1][0]+',120 '+pts[0][0]+',120';
 svg.innerHTML='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80" stop-opacity=".35"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></linearGradient></defs><polygon fill="url(#g)" points="'+area+'"/><polyline fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round" points="'+line+'"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#4ade80"/>').join('');
 const diff=(vals[vals.length-1]-vals[0]).toFixed(1);
 $('wSub').textContent='Сейчас '+vals[vals.length-1]+' кг, изменение: '+(diff>0?'+':'')+diff+' кг'+(d.goal?', цель '+d.goal+' кг':'');
}

function render(){
 const d=load();if(!d)return;
 const day=dayNumber(d);
 const todays=d.log.filter(m=>m.date===today());
 const sum=k=>todays.reduce((s,m)=>s+(m[k]||0),0);
 const kc=sum('kcal'),p=sum('p'),f=sum('f'),c=sum('c');
 $('hello').textContent='Привет, '+d.name;
 $('dateTxt').textContent=new Date().toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'});
 $('kcal').textContent=kc;
 $('meals').innerHTML=todays.map(m=>'<div class="meal"><div class="ico">'+mealIcon(m.time)+'</div><div class="info"><div class="nm">'+esc(m.name)+'</div><div class="mc">'+esc(m.time)+' · Б'+m.p+' Ж'+m.f+' У'+m.c+'</div></div><div class="kc">'+m.kcal+'</div><button class="del" onclick="delMeal('+(m.id||0)+')">✕</button></div>').join('')||'<div class="sub">Пока пусто. Сфотографируй первый приём пищи.</div>';
 $('report').classList.add('hidden');$('tip').classList.add('hidden');$('boost').classList.add('hidden');
 drawChart(d);
 if(day<=3){
  $('kcalSub').textContent='Режим наблюдения, день '+day+' из 3. Просто фотографируй всё, что ешь.';
  setRing(0,0);
  setBar('p','Б '+p+' г',0,0);setBar('f','Ж '+f+' г',0,0);setBar('c','У '+c+' г',0,0);
  return;
 }
 if(d.baseline==null){
  d.observed=observedAvg(d);
  d.baseline=d.observed||maintenance(d);
  d.reportShown=false;save(d);
 }
 const t=targets(d);
 if(!d.reportShown){
  $('report').classList.remove('hidden');
  $('report').innerHTML=d.observed
   ?'<b>Итог наблюдения</b><br>За три дня ты ел в среднем '+d.observed+' ккал. Для набора веса тебе нужно около '+t.kcal+' ккал в день. Не хватало примерно '+Math.max(0,t.kcal-d.observed)+' ккал.<button class="sec" onclick="closeReport()">Понятно</button>'
   :'<b>Итог наблюдения</b><br>За три дня не было записей, поэтому норма посчитана по формуле: около '+t.kcal+' ккал в день.<button class="sec" onclick="closeReport()">Понятно</button>';
 }
 if(d.boostMsg){
  $('boost').classList.remove('hidden');
  $('boost').innerHTML=esc(d.boostMsg)+'<button class="sec" onclick="closeBoost()">Понятно</button>';
 }
 const left=t.kcal-kc;
 setRing(kc,t.kcal);
 $('kcalSub').textContent='Цель '+t.kcal+' ккал, осталось '+Math.max(0,left);
 setBar('p','Б '+p+' / '+t.p+' г',p,t.p);
 setBar('f','Ж '+f+' / '+t.f+' г',f,t.f);
 setBar('c','У '+c+' / '+t.c+' г',c,t.c);
 let tip='';
 if(left<=0)tip='Норма на сегодня выполнена. Отлично!';
 else{
  const lp=Math.max(0,t.p-p);
  tip='<b>Что съесть сегодня</b><br>Осталось '+left+' ккал'+(lp>0?' и около '+lp+' г белка':'')+'. Идея: ';
  tip+=left>700?'полноценный приём пищи, например паста с курицей и оливковым маслом, плюс орехи и молочный коктейль.':left>300?'творог с бананом и мёдом или бутерброды с арахисовой пастой.':'горсть орехов или стакан молока с печеньем.';
 }
 $('tip').classList.remove('hidden');$('tip').innerHTML=tip;
}

function closeReport(){const d=load();d.reportShown=true;save(d);render()}
function closeBoost(){const d=load();d.boostMsg=null;save(d);render()}

// Обновить экран, если приложение открыли на следующий день, не перезапуская
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&load())render()});

function init(){
 const d=load();
 if(d){d.log=d.log||[];d.log.forEach((m,i)=>{if(!m.id)m.id=Date.now()-i*1000});save(d)}
 $('setup').classList.toggle('hidden',!!d);
 $('main').classList.toggle('hidden',!d);
 if(d)render();
}
init();
</script>
</body>
</html>
