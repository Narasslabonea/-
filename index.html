<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>Калорийка</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1115;color:#fff;font-family:system-ui,sans-serif;padding:16px;max-width:480px;margin:0 auto}
h1{font-size:22px;margin-bottom:12px}
.card{background:#1a1d24;border-radius:16px;padding:16px;margin-bottom:12px}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#0f1115;color:#fff;font-size:16px}
button{width:100%;padding:16px;border:0;border-radius:14px;background:#4ade80;color:#000;font-size:18px;font-weight:700;margin-top:8px}
button.sec{background:#2a2e38;color:#fff;font-size:14px;padding:10px}
.ring{text-align:center;font-size:44px;font-weight:800}
.sub{text-align:center;color:#9aa0ab;font-size:14px}
.bar{height:10px;background:#2a2e38;border-radius:6px;margin:4px 0 10px}
.bar div{height:100%;background:#4ade80;border-radius:6px;width:0}
.row{display:flex;justify-content:space-between;font-size:14px}
.meal{padding:8px 0;border-bottom:1px solid #2a2e38;font-size:14px}
.hidden{display:none}
#file{display:none}
.wrow{display:flex;gap:8px}
.wrow input{flex:1}
.wrow button{width:auto;margin:6px 0;padding:12px 18px;font-size:16px}
#chart{width:100%;height:120px;display:block;margin-top:8px}
</style>
</head>
<body>

<div id="setup" class="card hidden">
<h1>Знакомство</h1>
<input id="name" placeholder="Имя">
<select id="sex"><option value="m">Мужской</option><option value="f">Женский</option></select>
<input id="age" type="number" placeholder="Возраст">
<input id="height" type="number" placeholder="Рост, см">
<input id="weight" type="number" step="0.1" placeholder="Текущий вес, кг">
<input id="goal" type="number" step="0.1" placeholder="Желаемый вес, кг">
<input id="key" placeholder="Ключ Gemini">
<button onclick="saveSetup()">Начать</button>
</div>

<div id="main" class="hidden">
<h1 id="hello"></h1>
<div class="card">
<div class="ring" id="kcal">0</div>
<div class="sub" id="kcalSub"></div>
</div>
<div class="card">
<div class="row"><span>Белки</span><span id="pTxt"></span></div><div class="bar"><div id="pBar"></div></div>
<div class="row"><span>Жиры</span><span id="fTxt"></span></div><div class="bar"><div id="fBar"></div></div>
<div class="row"><span>Углеводы</span><span id="cTxt"></span></div><div class="bar"><div id="cBar"></div></div>
</div>
<div class="card hidden" id="report"></div>
<div class="card hidden" id="tip"></div>
<div class="card hidden" id="boost"></div>
<input id="file" type="file" accept="image/*" capture="environment" onchange="onPhoto(this)">
<button onclick="document.getElementById('file').click()">📷 Сфотографировать</button>
<div class="card" style="margin-top:12px"><b>Вес</b>
<div class="wrow"><input id="wInput" type="number" step="0.1" placeholder="Вес сегодня, кг"><button onclick="addWeight()">Записать</button></div>
<svg id="chart" viewBox="0 0 300 120" preserveAspectRatio="none"></svg>
<div class="sub" id="wSub"></div>
</div>
<div class="card"><b>Сегодня</b><div id="meals"></div></div>
<button class="sec" onclick="resetAll()">Сбросить всё</button>
</div>

<script>
const $=id=>document.getElementById(id);
const load=()=>JSON.parse(localStorage.getItem('app')||'null');
const save=d=>localStorage.setItem('app',JSON.stringify(d));
const today=()=>new Date().toISOString().slice(0,10);

function saveSetup(){
 const w=+$('weight').value;
 const d={name:$('name').value,sex:$('sex').value,age:+$('age').value,height:+$('height').value,weight:w,goal:+$('goal').value,key:$('key').value.trim(),start:today(),log:[],weights:[{date:today(),w:w}],boost:0,boostDate:null};
 if(!d.name||!d.age||!d.height||!d.weight||!d.key){alert('Заполни все поля');return}
 save(d);init();
}

function resetAll(){if(confirm('Удалить все данные?')){localStorage.removeItem('app');init()}}

function dayNumber(d){return Math.floor((new Date(today())-new Date(d.start))/86400000)+1}

function maintenance(d){
 const bmr=10*d.weight+6.25*d.height-5*d.age+(d.sex==='m'?5:-161);
 return Math.round(bmr*1.4);
}

function observedAvg(d){
 const days={};
 d.log.forEach(m=>{days[m.date]=(days[m.date]||0)+m.kcal});
 const first=Object.keys(days).sort().slice(0,3);
 if(!first.length)return null;
 return Math.round(first.reduce((s,k)=>s+days[k],0)/first.length);
}

function currentWeight(d){
 const ws=d.weights||[];
 return ws.length?ws[ws.length-1].w:d.weight;
}

function targets(d){
 const base=d.baseline||maintenance(d);
 const kcal=Math.round(base*1.1)+(d.boost||0);
 const wt=currentWeight(d);
 const p=Math.round(wt*2);
 const f=Math.round(wt*1.0);
 const c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
 return{kcal,p,f,c,base};
}

function addWeight(){
 const d=load();
 const v=parseFloat($('wInput').value);
 if(!v||v<30||v>300){alert('Введи нормальный вес в кг');return}
 d.weights=d.weights||[];
 const last=d.weights[d.weights.length-1];
 if(last&&last.date===today()){last.w=v}else{d.weights.push({date:today(),w:v})}
 save(d);
 $('wInput').value='';
 checkBoost();
 render();
}

// Только повышаем норму: если за 14 дней вес вырос меньше чем на 0.2 кг, добавляем 150 ккал (не чаще раза в 14 дней).
// Если вес растёт быстро, ничего не убавляем.
function checkBoost(){
 const d=load();
 if(dayNumber(d)<=3)return;
 const ws=d.weights||[];
 if(ws.length<2)return;
 const last=ws[ws.length-1];
 const lastDate=new Date(last.date);
 const old=ws.filter(x=>(lastDate-new Date(x.date))/86400000>=13);
 if(!old.length)return;
 if(d.boostDate&&(lastDate-new Date(d.boostDate))/86400000<14)return;
 const ref=old[old.length-1];
 const gain=last.w-ref.w;
 if(gain<0.2){
  d.boost=(d.boost||0)+150;
  d.boostDate=last.date;
  d.boostMsg='Вес почти не рос за две недели, поэтому норма повышена на 150 ккал.';
  save(d);
 }
}

async function onPhoto(inp){
 const file=inp.files[0];if(!file)return;
 const d=load();
 $('kcalSub').textContent='Анализирую фото...';
 try{
  const b64=await toBase64(file);
  const prompt='Ты нутрициолог. Оцени блюдо на фото. Ответь ТОЛЬКО JSON без пояснений: {"name":"название","kcal":число,"protein":число,"fat":число,"carbs":число,"grams":число}. Если порция неочевидна, оцени типичную.';
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+d.key,{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:b64}}]}]})
  });
  const j=await r.json();
  let t=j.candidates[0].content.parts[0].text.replace(/```json|```/g,'').trim();
  const m=JSON.parse(t);
  d.log.push({date:today(),time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}),name:m.name,kcal:Math.round(m.kcal),p:Math.round(m.protein),f:Math.round(m.fat),c:Math.round(m.carbs)});
  save(d);
 }catch(e){alert('Ошибка анализа: '+e.message)}
 inp.value='';render();
}

function toBase64(file){
 return new Promise((res,rej)=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{
   const s=Math.min(1,1024/Math.max(img.width,img.height));
   const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   res(c.toDataURL('image/jpeg',0.8).split(',')[1]);
  };
  img.onerror=rej;img.src=url;
 });
}

function setBar(id,txt,v,max){
 $(id+'Txt').textContent=txt;
 $(id+'Bar').style.width=Math.min(100,max?v/max*100:0)+'%';
}

function drawChart(d){
 const ws=(d.weights||[]).slice(-30);
 const svg=$('chart');
 if(ws.length<2){svg.innerHTML='';$('wSub').textContent=ws.length?('Сейчас '+ws[0].w+' кг. График появится после второй записи.'):'';return}
 const vals=ws.map(x=>x.w);
 let min=Math.min(...vals),max=Math.max(...vals);
 if(d.goal){max=Math.max(max,Math.min(d.goal,max+5))}
 if(max-min<1){max=min+1}
 const pad=8;
 const pts=ws.map((x,i)=>{
  const px=pad+i*(300-2*pad)/(ws.length-1);
  const py=112-(x.w-min)/(max-min)*(104);
  return px.toFixed(1)+','+py.toFixed(1);
 });
 svg.innerHTML='<polyline fill="none" stroke="#4ade80" stroke-width="2.5" points="'+pts.join(' ')+'"/>'+pts.map(p=>'<circle cx="'+p.split(',')[0]+'" cy="'+p.split(',')[1]+'" r="3" fill="#4ade80"/>').join('');
 const diff=(vals[vals.length-1]-vals[0]).toFixed(1);
 $('wSub').textContent='Сейчас '+vals[vals.length-1]+' кг, изменение за период: '+(diff>0?'+':'')+diff+' кг'+(d.goal?', цель '+d.goal+' кг':'');
}

function render(){
 const d=load();if(!d)return;
 const day=dayNumber(d);
 const todays=d.log.filter(m=>m.date===today());
 const sum=k=>todays.reduce((s,m)=>s+(m[k]||0),0);
 const kc=sum('kcal'),p=sum('p'),f=sum('f'),c=sum('c');
 $('hello').textContent='Привет, '+d.name;
 $('kcal').textContent=kc+' ккал';
 $('meals').innerHTML=todays.map(m=>'<div class="meal">'+m.time+' — '+m.name+': '+m.kcal+' ккал (Б'+m.p+' Ж'+m.f+' У'+m.c+')</div>').join('')||'<div class="sub">Пока пусто</div>';
 $('report').classList.add('hidden');$('tip').classList.add('hidden');$('boost').classList.add('hidden');
 drawChart(d);
 if(day<=3){
  $('kcalSub').textContent='Режим наблюдения, день '+day+' из 3';
  setBar('p','Б '+p+' г',0,0);setBar('f','Ж '+f+' г',0,0);setBar('c','У '+c+' г',0,0);
  return;
 }
 if(!d.baseline){
  d.baseline=observedAvg(d)||maintenance(d);
  d.observed=observedAvg(d);
  d.reportShown=false;save(d);
 }
 const t=targets(d);
 if(!d.reportShown){
  const diff=t.kcal-(d.observed||0);
  $('report').classList.remove('hidden');
  $('report').innerHTML='<b>Итог наблюдения</b><br>За три дня ты ел в среднем '+(d.observed||'?')+' ккал. Для набора веса тебе нужно около '+t.kcal+' ккал в день. Не хватало примерно '+Math.max(0,diff)+' ккал.<br><button class="sec" onclick="closeReport()">Понятно</button>';
 }
 if(d.boostMsg){
  $('boost').classList.remove('hidden');
  $('boost').innerHTML=d.boostMsg+'<br><button class="sec" onclick="closeBoost()">Понятно</button>';
 }
 const left=t.kcal-kc;
 $('kcalSub').textContent='Цель '+t.kcal+' ккал, осталось '+Math.max(0,left);
 setBar('p','Б '+p+' / '+t.p+' г',p,t.p);
 setBar('f','Ж '+f+' / '+t.f+' г',f,t.f);
 setBar('c','У '+c+' / '+t.c+' г',c,t.c);
 let tip='';
 if(left<=0)tip='Норма на сегодня выполнена. Отлично!';
 else{
  const lp=Math.max(0,t.p-p);
  tip='Осталось '+left+' ккал'+(lp>0?' и около '+lp+' г белка':'')+'. Идея: ';
  tip+=left>700?'полноценный приём пищи, например паста с курицей и оливковым маслом, плюс орехи и молочный коктейль.':left>300?'творог с бананом и мёдом или бутерброды с арахисовой пастой.':'горсть орехов или стакан молока с печеньем.';
 }
 $('tip').classList.remove('hidden');$('tip').textContent=tip;
}

function closeReport(){const d=load();d.reportShown=true;save(d);render()}
function closeBoost(){const d=load();d.boostMsg=null;save(d);render()}

function init(){
 const d=load();
 $('setup').classList.toggle('hidden',!!d);
 $('main').classList.toggle('hidden',!d);
 if(d)render();
}
init();
</script>
</body>
</html>
